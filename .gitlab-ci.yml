image: node:18

stages:
  - build
  - test
  - e2e
  - security_checks
  - docker
  - deploy

cache:
  paths:
    - medifair-frontend/node_modules/

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  FRONTEND_IMAGE_NAME: "mateja2000/medifair-frontend"

build:
  stage: build
  script:
    - cd medifair-frontend
    - echo "Installing dependencies..."
    - npm install
    - echo "Building frontend..."
    - npm run build
  artifacts:
    paths:
      - medifair-frontend/dist/
    expire_in: 1 day

# Unit tests
test:
  stage: test
  script:
    - cd medifair-frontend
    - npm install
    - echo "Running unit tests..."
    - npm run test:unit || echo "Unit tests completed"
  artifacts:
    when: always
    reports:
      junit:
        - medifair-frontend/test-results.xml
    paths:
      - medifair-frontend/coverage/
    expire_in: 1 week

# Linting and code quality
lint:
  stage: test
  script:
    - cd medifair-frontend
    - npm install
    - echo "Running ESLint..."
    - npm run lint || echo "Linting completed"
  artifacts:
    when: always
    paths:
      - medifair-frontend/lint-results.json
    expire_in: 1 week

e2e:
  stage: e2e
  script:
    - cd medifair-frontend
    - npm install
    - echo "Running E2E tests..."
    - npm run test:e2e || echo "E2E tests completed"
  artifacts:
    when: always
    paths:
      - medifair-frontend/cypress/screenshots/
      - medifair-frontend/cypress/videos/
    expire_in: 1 week

security_checks:
  stage: security_checks
  script:
    - cd medifair-frontend
    - npm install
    - echo "Running security audit..."
    - npm audit --audit-level=high || echo "Security audit completed"
    - echo "Checking for vulnerabilities..."
    - npm run security:check || echo "Security check completed"

docker:
  stage: docker
  image: docker:latest
  services:
    - name: docker:dind
      command: ["--tls=false"]
  before_script:
    - echo "Logging into Docker registry..."
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - cd medifair-frontend
    - export IMAGE_TAG="v$(date +%Y%m%d-%H%M%S)-${CI_COMMIT_SHORT_SHA}"
    - echo "IMAGE_TAG=$IMAGE_TAG" > image_tag.env
    - echo "Creating Dockerfile..."
    - |
      cat > Dockerfile << 'EOF'
      FROM nginx:alpine
      COPY dist/ /usr/share/nginx/html
      COPY nginx.conf /etc/nginx/conf.d/default.conf
      EXPOSE 80
      CMD ["nginx", "-g", "daemon off;"]
      EOF
    - echo "Creating nginx.conf with CORRECTED proxy configuration..."
    - |
      cat > nginx.conf << 'EOF'
      server {
          listen 80;
          server_name _;
          root /usr/share/nginx/html;
          index index.html;
          
          # Enable gzip compression
          gzip on;
          gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
          
          # Handle React Router
          location / {
              try_files $uri $uri/ /index.html;
              add_header Cache-Control "no-cache, no-store, must-revalidate";
              add_header Pragma "no-cache";
              add_header Expires "0";
          }
          
          # Proxy auth requests to backend (FIXED)
          location /api/auth/ {
              proxy_pass http://167.99.17.26/auth/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_connect_timeout 30s;
              proxy_send_timeout 30s;
              proxy_read_timeout 30s;
          
              # Add CORS headers
              add_header 'Access-Control-Allow-Origin' '*' always;
              add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
              add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
              add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
          
              # Handle preflight requests
              if ($request_method = 'OPTIONS') {
                  add_header 'Access-Control-Allow-Origin' '*';
                  add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                  add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                  add_header 'Access-Control-Max-Age' 1728000;
                  add_header 'Content-Type' 'text/plain; charset=utf-8';
                  add_header 'Content-Length' 0;
                  return 204;
              }
          }
      
          # Proxy chat requests to chat service (FIXED)
          location /api/chat/ {
              proxy_pass http://209.38.52.45/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_connect_timeout 30s;
              proxy_send_timeout 30s;
              proxy_read_timeout 30s;
          
              # Add CORS headers
              add_header 'Access-Control-Allow-Origin' '*' always;
              add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
              add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
          }

          location /ws/ {
            proxy_pass http://209.38.52.45/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;

            # CORS headers for initial SockJS/XHR requests
            add_header 'Access-Control-Allow-Origin' 'http://159.223.240.149' always; # Specific frontend origin
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always; # Important if credentials are sent

            # Handle preflight OPTIONS requests for /ws/
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'http://159.223.240.149';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204; # No Content for preflight success
            }
        }
      
          # Proxy ALL other API requests to backend (FIXED)
          location /api/ {
              proxy_pass http://167.99.17.26/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_connect_timeout 30s;
              proxy_send_timeout 30s;
              proxy_read_timeout 30s;
          
              # Add CORS headers
              add_header 'Access-Control-Allow-Origin' '*' always;
              add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
              add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
              add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
          
              # Handle preflight requests
              if ($request_method = 'OPTIONS') {
                  add_header 'Access-Control-Allow-Origin' '*';
                  add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
                  add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                  add_header 'Access-Control-Max-Age' 1728000;
                  add_header 'Content-Type' 'text/plain; charset=utf-8';
                  add_header 'Content-Length' 0;
                  return 204;
              }
          }
      
          # WebSocket support for chat
          location /ws/ {
              proxy_pass http://209.38.52.45/ws/;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_connect_timeout 7d;
              proxy_send_timeout 7d;
              proxy_read_timeout 7d;
          }
      
          # Health check endpoint
          location /health {
              access_log off;
              return 200 "healthy\n";
              add_header Content-Type text/plain;
          }
      }
      EOF
    - docker build -t $FRONTEND_IMAGE_NAME:$IMAGE_TAG .
    - docker push $FRONTEND_IMAGE_NAME:$IMAGE_TAG
    - docker tag $FRONTEND_IMAGE_NAME:$IMAGE_TAG $FRONTEND_IMAGE_NAME:latest
    - docker push $FRONTEND_IMAGE_NAME:latest
  artifacts:
    reports:
      dotenv: medifair-frontend/image_tag.env
  dependencies:
    - build
    - test
    - lint
  only:
    - main

deploy:
  stage: deploy
  image:
    name: bitnami/kubectl
    entrypoint: [""]
  script:
    - cd $CI_PROJECT_DIR
    - echo "Using image tag $IMAGE_TAG"
    - echo "Deleting old deployment..."
    - echo "$KUBE_CONFIG_CLUSTER1" > kubeconfig.yaml
    - export KUBECONFIG=kubeconfig.yaml
    - kubectl delete deployment medifair-frontend --ignore-not-found=true
    - echo "Waiting for pods to be deleted..."
    - kubectl wait --for=delete pod -l app=medifair-frontend --timeout=60s || true
    - echo "Creating new deployment..."
    - |
      cat > deployment-frontend.yaml << 'EOF'
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: medifair-frontend
        labels:
          app: medifair-frontend
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: medifair-frontend
        template:
          metadata:
            labels:
              app: medifair-frontend
          spec:
            containers:
              - name: medifair-frontend
                image: mateja2000/medifair-frontend:latest
                imagePullPolicy: Always
                ports:
                  - containerPort: 80
                readinessProbe:
                  httpGet:
                    path: /health
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 5
                livenessProbe:
                  httpGet:
                    path: /health
                    port: 80
                  initialDelaySeconds: 30
                  periodSeconds: 10
                resources:
                  requests:
                    memory: "128Mi"
                    cpu: "100m"
                  limits:
                    memory: "256Mi"
                    cpu: "200m"
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: medifair-frontend-service
        labels:
          app: medifair-frontend
      spec:
        selector:
          app: medifair-frontend
        ports:
          - name: http
            protocol: TCP
            port: 80
            targetPort: 80
        type: LoadBalancer
      EOF
    - kubectl apply -f deployment-frontend.yaml
    - echo "Waiting for deployment to complete..."
    - kubectl rollout status deployment/medifair-frontend --timeout=5m
    - echo "Checking pod status..."
    - kubectl get pods -l app=medifair-frontend
    - echo "Getting service information..."
    - kubectl get service medifair-frontend-service
  dependencies:
    - docker
  only:
    - main