image: node:18

stages:
  - build

cache:
  paths:
    - node_modules/

before_script:
  - cd medifair-frontend  
  - echo "Installing dependencies..."
  - npm install

build:
  stage: build
  script:
    #- cd medifar-frontend   Add this if needed
    - echo "Building frontend..."
    - npm run build
  artifacts:
    paths:
      - frontend/dist/