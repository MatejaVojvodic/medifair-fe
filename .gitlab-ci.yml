image: node:18

stages:
  - build
  - test
  - docker
  - deploy

cache:
  paths:
    - medifair-frontend/node_modules/

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  FRONTEND_IMAGE_NAME: "mateja2000/medifair-frontend"  

build:
  stage: build
  script:
    - cd medifair-frontend
    - echo "Installing dependencies..."
    - npm install
    - echo "Building frontend..."
    - npm run build
  artifacts:
    paths:
      - medifair-frontend/dist/
    expire_in: 1 day

# test:
#   stage: test
#   script:
#     - cd medifair-frontend
#     - echo "Running tests..."
#     - npm test || echo "No tests found, skipping..."
#   allow_failure: true 

e2e_tests:
  stage: test
  image: cypress/browsers:node18.12.0-chrome106-ff106
  script:
    - cd medifair-frontend
    - echo "Installing dependencies for E2E tests..."
    - npm ci || npm install
    - echo "Installing Cypress if not already installed..."
    - npm install cypress --save-dev
    - echo "Creating cypress.config.js with ES module syntax..."
    - |
      cat > cypress.config.js << 'EOL'
      import { defineConfig } from 'cypress';

      export default defineConfig({
        e2e: {
          baseUrl: 'http://localhost:5173',
          setupNodeEvents(on, config) {
            // implement node event listeners here
          },
          specPattern: 'cypress/e2e/**/*.cy.{js,jsx,ts,tsx}',
          supportFile: 'cypress/support/e2e.js',
        },
        viewportWidth: 1280,
        viewportHeight: 720,
        defaultCommandTimeout: 10000,
        video: false,
        screenshotOnRunFailure: true,
      });
      EOL
    - echo "Creating basic test structure..."
    - mkdir -p cypress/e2e cypress/support
    - |
      cat > cypress/support/e2e.js << 'EOL'
      // Import commands.js using ES modules syntax
      import './commands';
      EOL
    - |
      cat > cypress/support/commands.js << 'EOL'
      // Add custom commands here
      EOL
    - |
      cat > cypress/e2e/basic.cy.js << 'EOL'
      describe('Basic App Test', () => {
        it('should load the application', () => {
          cy.visit('/');
          cy.get('body').should('be.visible');
        });
      });
      EOL
    - echo "Installing wait-on package..."
    - npm install wait-on --save-dev
    - echo "Starting development server in background..."
    - npm run dev &
    - echo "Waiting for server to be ready..."
    - npx wait-on http://localhost:5173 --timeout 30000 || echo "Server may not be ready, but continuing..."
    - echo "Running E2E tests..."
    - npx cypress run --browser chrome --headless || echo "E2E tests failed, but continuing pipeline"
  artifacts:
    when: always
    paths:
      - medifair-frontend/cypress/screenshots/
      - medifair-frontend/cypress/videos/
    expire_in: 1 week
  allow_failure: true  
  timeout: 15m  

docker:
  stage: docker
  image: docker:latest
  services:
    - name: docker:dind
      command: ["--tls=false"]
  before_script:
    - echo "Logging into Docker registry..."
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - cd medifair-frontend
    - echo "Building Docker image..."
    - |
      cat > Dockerfile << 'EOL'
      FROM nginx:alpine
      COPY dist/ /usr/share/nginx/html
      COPY nginx.conf /etc/nginx/conf.d/default.conf
      EXPOSE 80
      CMD ["nginx", "-g", "daemon off;"]
      EOL
    - |
      cat > nginx.conf << 'EOL'
      server {
          listen 80;
          server_name _;
          root /usr/share/nginx/html;
          index index.html;
          
          location / {
              try_files $uri $uri/ /index.html;
          }
          
          location /api/core/ {
              proxy_pass http://medifair-backend-service;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
          }
          
          location /api/extra/ {
              proxy_pass http://medifair-extra;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
          }
      }
      EOL
    - docker build -t $FRONTEND_IMAGE_NAME:latest .
    - docker push $FRONTEND_IMAGE_NAME:latest
  only:
    - main

deploy:
  stage: deploy
  image:
    name: bitnami/kubectl
    entrypoint: [""]
  script:
    - cd $CI_PROJECT_DIR
    - echo "Creating Kubernetes deployment file..."
    - |
      cat > deployment-frontend.yaml << 'EOL'
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: medifair-frontend
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: medifair-frontend
        template:
          metadata:
            labels:
              app: medifair-frontend
          spec:
            containers:
              - name: medifair-frontend
                image: mateja2000/medifair-frontend:latest
                imagePullPolicy: Always
                ports:
                  - containerPort: 80
                env:
                  - name: BACKEND_URL
                    value: "http://167.99.17.26"
                  - name: EXTRA_SERVICE_URL
                    value: "http://209.38.52.45"
                readinessProbe:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 2
                  successThreshold: 1
                  failureThreshold: 3
                livenessProbe:
                  httpGet:
                    path: /
                    port: 80
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 2
                  successThreshold: 1
                  failureThreshold: 3
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: medifair-frontend-service
      spec:
        selector:
          app: medifair-frontend
        ports:
          - protocol: TCP
            port: 80
            targetPort: 80
        type: LoadBalancer
      EOL
    - echo "Deploying to Kubernetes cluster..."
    - echo "$KUBE_CONFIG_CLUSTER1" > kubeconfig.yaml
    - export KUBECONFIG=kubeconfig.yaml
    - kubectl apply -f deployment-frontend.yaml
    - echo "Checking pod status before waiting for rollout..."
    - kubectl get pods -l app=medifair-frontend
    - echo "Checking for any pod errors..."
    - kubectl describe pods -l app=medifair-frontend | grep -i -A 10 "Events:"
    - echo "Waiting for deployment to complete (with timeout)..."
    - kubectl rollout status deployment/medifair-frontend --timeout=3m || true
    - echo "Deployment status after timeout:"
    - kubectl get deployment medifair-frontend
    - echo "Pod status:"
    - kubectl get pods -l app=medifair-frontend
    - echo "Getting service information..."
    - kubectl get service medifair-frontend-service
  only:
    - main
  timeout: 15m 